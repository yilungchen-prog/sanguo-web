function sfxRel(el){const b=$('board'),br=b.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-br.left+r.width/2,y:r.top-br.top+r.height/2,w:r.width,h:r.height}}

 const an=d.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:0},{transform:`translate(calc(-50% + ${(q.x-p.x)/2}px),calc(-50% + ${(q.y-p.y)/2-40}px)) scale(1.2)`,opacity:1},{transform:`translate(calc(-50% + ${q.x-p.x}px),calc(-50% + ${q.y-p.y}px)) scale(.9)`,opacity:0}],{duration:(dur||600)/BSPD,easing:'ease-in-out'});return an.finished.then(()=>d.remove(),()=>d.remove())}

 <div class="sec">槽位（${J.sl.filter(Boolean).length}/${J.open}）</div><div class="sub">放進槽位的武將，等級直接等於豪傑書等級（不能自己升級或歸零）。武將離開槽位後，該槽位冷卻 24 小時。</div>

function jump(c,tc,melee,big,mine){if(SKIP||ANIM==='off'||!c||!tc)return sleep(0);
 const a=c.getBoundingClientRect(),b=tc.getBoundingClientRect(),dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),k=melee?.8:.25,h=Math.min(110,a.height*.55),sc=melee?(big?1.9:1.6):(big?1.55:1.3),rot=(mine?1:-1)*(big?12:8),dur=big?950:620;
 c.style.zIndex=60;c.style.transition='none';
 const an=c.animate([{transform:'translate(0,0) scale(1) rotate(0)',offset:0},{transform:`translate(${-dx*.04}px,${-dy*.04+8}px) scale(.92,.86) rotate(0)`,offset:.12},

   const ctl=['ql','kd','fz'].find(k=>has(u,k));
   if(ctl){if(BLOG){BLOG.skip=BLOG.skip||[0,0];BLOG.skip[m?0:1]++}const s=u.ST[ctl];s.t--;LBL(u,STD[ctl].n,ctl==='fz'?'fx-i':'fx-c');if(s.t<=0){delete u.ST[ctl];if(ctl==='fz')u.fi=1}upd(u);await sleep(240);continue}

   if(u.X.again&&u.hp>0&&alive(foeOf(u)).length){u.X.again=0;LBL(u,'再行動','fx-c');await act(u,!!m,false,{extra:1})}
   await sleep(100)}
  await roundEndV2();await poison();await flushFU()}
 finish()}
