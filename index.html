 for(const b of on){const mem=us.filter(u=>b.ids.includes(u.id));us.forEach(u=>{u.X.bd=u.X.bd||{};u.X.bd[b.k]=1;if(b.k==='hj'){u.X.bd.hj2=1;if(b.c>=3)u.X.bd.hj3=1}});
  const hpUp=(u,p)=>{const o=u.mhp;u.mhp=Math.round(u.mhp*(1+p));u.hp=Math.round(u.hp*u.mhp/o)};
  switch(b.k){case 'ty':mem.forEach(u=>{u.atk*=1.1;u.X.ty=1});break;
   case 'wh':mem.forEach(u=>{u.X.fuDb=.1;if(b.c>=4)u.cr=(u.cr||0)+.05;if(b.c>=5){u.rage+=30;u.X.whImm=1}});break;

   case 'wl':if(b.c>=3)mem.filter(u=>u.id==='zhugeliang').forEach(u=>u.rage+=50);break;

   case 'eq':mem.forEach(u=>{u.hb=(u.hb||0)+.15;u.X.bnB=.15});break;

function artKeys(){return [...H.map(h=>['hero',h.id]),...BEA.map(b=>['bea',b.id])]}
function artStats(){const K=artKeys(),hs=K.filter(([k,id])=>k==='hero'&&UGC_TOP[ugcKey(k,id)]).length,bs=K.filter(([k,id])=>k==='bea'&&UGC_TOP[ugcKey(k,id)]).length,nw=K.filter(([k,id])=>ugcIsNew(k,id)).length;return{hs,bs,nw}}
function artMarkSeen(){S.ugcSeen=S.ugcSeen||{};const t=Date.now();artKeys().forEach(([k,id])=>S.ugcSeen[ugcKey(k,id)]=t)}
function artApply(mode,mine){S.ugc=S.ugc||{};let n=0;
 for(const[k,id]of artKeys()){const key=ugcKey(k,id),cur=S.ugc[key],top=UGC_TOP[key];
  if(mode==='new'){if(ugcIsNew(k,id)&&top&&cur!==top){S.ugc[key]=top;n++}continue}
  const custom=cur&&cur!=='ink';if(custom&&!mine)continue;
  if(mode==='top'){if(cur)delete S.ugc[key];if(top&&cur!==top)n++}
  else{if(cur!=='ink'&&(top||custom))n++;delete S.ugc[key]}}
 if(mode!=='new')S.artPref=mode;artMarkSeen();saveS();ugcRecalc();for(const c of[ARTC,ART2C])for(const k in c)delete c[k];if(!busy)render();return n}
function artModal(first){const st=artStats(),d=document.createElement('div');d.className='bgp vmod';const sample=H.find(h=>UGC_TOP[ugcKey('hero',h.id)])||H[0];
 const hasCustom=artKeys().some(([k,id])=>{const v=(S.ugc||{})[ugcKey(k,id)];return v&&v!=='ink'});
 d.innerHTML=`<div class="bgpp"><h3>${first?'選擇武將圖卡風格':'一鍵換圖'}</h3>
 <div class="arts"><div><span style="background-image:url(${UGC_TOP[ugcKey('hero',sample.id)]||artOfInk(sample.id,false)})"></span><b>玩家票選</b></div><div><span style="background-image:url(${artOfInk(sample.id,false)})"></span><b>水墨畫</b></div></div>
 <p class="sub" style="text-align:center">目前圖庫：${st.hs} 位武將、${st.bs} 位紅顏有玩家上傳的圖${st.nw?`，其中 <b style="color:#ffd27a">${st.nw}</b> 位有新圖`:''}</p>
 ${!first&&hasCustom?'<label class="stwc"><input type="checkbox" id="artMine"> 連我自己在圖鑑挑過的也一起換</label>':''}
 <div class="artb"><button data-a="top">🏆 使用玩家票選第一名<small>沒人上傳的維持水墨畫，之後有新圖會自動換上</small></button><button class="g" data-a="ink">🖌 全部使用水墨畫<small>之後有新圖只會提示，不會自動換</small></button>${!first?`<button class="g" data-a="new" ${st.nw?'':'disabled'}>✨ 只換有新圖的（${st.nw}）<small>其他維持現狀</small></button>`:''}</div>
 <p class="sub" style="text-align:center">${first?'之後可以在武將列表的「🎨 換圖」隨時更改。':''}</p>${first?'':'<div class="bgpb"><button class="g" data-a="x">關閉</button></div>'}</div>`;
 d.onclick=e=>{const b=e.target.closest('[data-a]');if(!b){if(e.target===d&&!first)d.remove();return}const a=b.dataset.a;if(a==='x'){d.remove();return}
  const mine=!!(d.querySelector('#artMine')||{}).checked,n=artApply(a,mine);d.remove();toast(a==='ink'?`已改用水墨畫（${n} 位）`:`已更換 ${n} 位圖卡`)};document.body.appendChild(d)}

/* ===================== 分頁左右滑 ===================== */
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
function pager(pages,cls,id){return `<div class="pgw ${cls||''}"${id?` data-pg="${id}"`:''}><div class="pg">${pages.map(p=>`<section>${p}</section>`).join('')}</div>${pages.length>1?`<div class="pgd">${pages.map((_,i)=>`<i data-pgi="${i}" class="${i?'':'on'}"></i>`).join('')}<span>左右滑動</span></div>`:''}</div>`}
const PGPOS={};
function pgSync(t){const i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));t.parentNode.querySelectorAll('.pgd i').forEach((d,k)=>d.classList.toggle('on',k===i));const id=t.parentNode.dataset.pg;if(id)PGPOS[id]=i}
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('pg'))pgSync(t)},true);
document.addEventListener('click',e=>{const d=e.target.closest&&e.target.closest('[data-pgi]');if(!d)return;const p=d.closest('.pgw').querySelector('.pg');p.scrollTo({left:p.clientWidth*+d.dataset.pgi,behavior:'smooth'})},true);
function pgRestore(root){(root||document).querySelectorAll('.pgw[data-pg]').forEach(w=>{const i=PGPOS[w.dataset.pg]||0,p=w.querySelector('.pg');if(i&&p){p.scrollLeft=p.clientWidth*i;pgSync(p)}})}
