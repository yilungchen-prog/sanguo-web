 <div class="bgpb">${isNew?'<button class="g" data-v="all">更新紀錄</button>':''}<button data-v="x">知道了</button></div></div>`;
 d.onclick=e=>{const b=e.target.closest('[data-v]');if(e.target!==d&&!b)return;verMark();d.remove();if(b&&b.dataset.v==='all')verShow(CHANGES,false)};document.body.appendChild(d)}

 <p class="sub" style="text-align:center">按「確定」就算投你選的畫風一票，之後可以隨時改。<br>得票最高的畫風會成為新玩家的預設畫風。</p>
